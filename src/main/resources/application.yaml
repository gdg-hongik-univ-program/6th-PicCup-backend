spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  #MySQL 세션 저장소 설정
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always # SPRING_SESSION 테이블 자동 생성
    timeout: 7d # 서버 측 세션 7일 유지

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        max-age: 7d # 프론트엔드 쿠키 7일 유지
        same-site: none   # 다른 도메인 간 전송 허용 (백/프론트 연결 시 오류 방지)
        secure: true      # HTTPS 환경에서만 동작

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: ap-northeast-2
    s3:
      bucket: piccup-bestpick-6th